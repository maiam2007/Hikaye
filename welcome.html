<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hikaye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif;
    background: linear-gradient(
      to bottom,
      #8B0058 0%,
      #8B0058 18%,
      #b3568f 28%,
      #ddb3cd 34%,
      #fdf8f0 38%,
      #fdf8f0 100%
    );
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 120px 20px 60px;
    text-align: center;
    overflow-x: hidden;
  }

  /* زر تبديل اللغة */
  .langToggle {
    position: fixed;
    top: 20px;
    inset-inline-end: 20px;
    display: flex;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
    padding: 4px;
    z-index: 10;
    opacity: 0;
    animation: fadeIn 0.6s ease forwards;
    animation-delay: 1.6s;
  }
  .langToggle button {
    border: none;
    background: transparent;
    padding: 6px 16px;
    border-radius: 999px;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    font-size: 13px;
    cursor: pointer;
    color: #fdf8f0;
  }
  .langToggle button.active {
    background: #fdf8f0;
    color: #8B0058;
    font-weight: 600;
  }

  .logo {
    width: 250px;
    height: 250px;
    object-fit: contain;
    margin-top: -30px;
    opacity: 0;
    animation: riseIn 0.7s ease forwards;
    animation-delay: 0.2s;
  }

  .wordmark {
    width: 280px;
    margin-top: 8px;
    object-fit: contain;
    mix-blend-mode: multiply;
    opacity: 0;
    animation: riseIn 0.7s ease forwards;
    animation-delay: 0.9s;
  }

  .divider {
    width: 90px;
    height: 2px;
    margin: 10px 0;
    background: linear-gradient(to left, transparent, #d4af6a, transparent);
    opacity: 0;
    animation: fadeIn 0.6s ease forwards;
    animation-delay: 1.5s;
  }

  .tagline {
    font-size: 17px;
    color: #5c1f2e;
    font-weight: 500;
    opacity: 0;
    animation: fadeIn 0.7s ease forwards;
    animation-delay: 1.9s;
  }
  .tagline[lang="en"] {
    font-family: 'Cormorant Garamond', serif;
    display: none;
  }

  .startBtn {
    margin-top: 10px;
    padding: 14px 46px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #8B0058, #5c1f2e);
    color: #fdf8f0;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    display: inline-block;
    box-shadow: 0 6px 18px rgba(92,31,46,0.35);
    opacity: 0;
    animation: fadeIn 0.7s ease forwards;
    animation-delay: 2.3s;
  }

  /* السوشال ميديا */
  .social {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0;
    animation: fadeIn 0.7s ease forwards;
    animation-delay: 2.7s;
  }

  .social a {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #5c1f2e;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    font-size: 14px;
    font-weight: 500;
  }

  .social svg {
    width: 20px;
    height: 20px;
    fill: #5c1f2e;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

<div class="langToggle">
  <button id="btnAr" class="active" onclick="setLang('ar')">عربي</button>
  <button id="btnEn" onclick="setLang('en')">EN</button>
</div>

<img class="logo" src="logo.png" alt="Hikaye logo" />
<img class="wordmark" src="wordmark.png" alt="حكاية" />

<div class="divider"></div>

<div class="tagline" lang="ar">وجّه الكاميرا... عيشها من جديد</div>
<div class="tagline" lang="en">Point your camera... relive it</div>

<a class="startBtn" id="startBtn" href="index.html">
  <span lang="ar">ابدأ المسح</span>
</a>

<div class="social">
  <a href="https://www.instagram.com/hikaye_store_?igsh=MTFodGVmMGYyNXJ4OQ%3D%3D&igsi=MTFodGVmMGYyNXJ4OQ%3D%3D&utm_source=qr"  target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M12 2c2.717 0 3.056.01 4.122.06 1.065.05 1.79.217 2.428.465a4.902 4.902 0 0 1 1.772 1.153 4.902 4.902 0 0 1 1.153 1.772c.248.637.415 1.363.465 2.428.05 1.066.06 1.405.06 4.122 0 2.717-.01 3.056-.06 4.122-.05 1.065-.217 1.79-.465 2.428a4.902 4.902 0 0 1-1.153 1.772 4.902 4.902 0 0 1-1.772 1.153c-.637.248-1.363.415-2.428.465-1.066.05-1.405.06-4.122.06-2.717 0-3.056-.01-4.122-.06-1.065-.05-1.79-.217-2.428-.465a4.902 4.902 0 0 1-1.772-1.153 4.902 4.902 0 0 1-1.153-1.772c-.248-.637-.415-1.363-.465-2.428C2.013 15.056 2 14.717 2 12c0-2.717.01-3.056.06-4.122.05-1.065.217-1.79.465-2.428a4.902 4.902 0 0 1 1.153-1.772A4.902 4.902 0 0 1 5.45 2.525c.637-.248 1.363-.415 2.428-.465C8.944 2.013 9.283 2 12 2zm0 1.802c-2.67 0-2.986.01-4.04.059-.976.045-1.505.207-1.858.344-.466.181-.8.398-1.15.748-.35.35-.567.684-.748 1.15-.137.353-.3.882-.344 1.858-.05 1.054-.06 1.37-.06 4.04 0 2.67.01 2.986.06 4.04.045.976.207 1.505.344 1.858.181.466.398.8.748 1.15.35.35.684.567 1.15.748.353.137.882.3 1.858.344 1.054.05 1.37.06 4.04.06 2.67 0 2.986-.01 4.04-.06.976-.045 1.505-.207 1.858-.344.466-.181.8-.398 1.15-.748.35-.35.567-.684.748-1.15.137-.353.3-.882.344-1.858.05-1.054.06-1.37.06-4.04 0-2.67-.01-2.986-.06-4.04-.045-.976-.207-1.505-.344-1.858a3.1 3.1 0 0 0-.748-1.15 3.1 3.1 0 0 0-1.15-.748c-.353-.137-.882-.3-1.858-.344-1.054-.05-1.37-.059-4.04-.059zm0 3.063a5.135 5.135 0 1 1 0 10.27 5.135 5.135 0 0 1 0-10.27zm0 1.802a3.333 3.333 0 1 0 0 6.666 3.333 3.333 0 0 0 0-6.666zm5.338-1.997a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0z"/></svg>
    <span>hikaye.iq</span>
  </a>
</div>

<script>
  function setLang(lang) {
    document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
    document.getElementById('btnEn').classList.toggle('active', lang === 'en');

    document.querySelectorAll('.tagline').forEach(el => {
      el.style.display = (el.getAttribute('lang') === lang) ? 'block' : 'none';
    });

    document.querySelector('#startBtn span').textContent =
      lang === 'ar' ? 'ابدأ المسح' : 'Start Scanning';
  }

  window.addEventListener('DOMContentLoaded', () => {
    const params = window.location.search;
    if (params) {
      document.getElementById('startBtn').href = 'index.html' + params;
    }
  });
</script>

</body>
</html>
