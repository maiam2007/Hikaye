<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://aframe.io https://cdn.jsdelivr.net 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https://ptzuauxjftwfsyjohogi.supabase.co; connect-src 'self' blob: data: https:; font-src 'self' data: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'" />
<meta name="referrer" content="no-referrer" />
<title>Hikaye</title>
<style>
body { margin: 0; overflow: hidden; background: #000; }
#videoOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 999; justify-content: center; align-items: center; flex-direction: column; }
#myVideo { max-width: 100%; max-height: 85vh; }
#playBtn { position: absolute; width: 70px; height: 70px; background: rgba(255,255,255,0.9); border-radius: 50%; border: none; font-size: 28px; color: #333; }
#errorMsg, #loadingMsg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1000; display: none; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; font-family: Tahoma, sans-serif; color: #6b2737; font-size: 18px; direction: rtl; }
#loadingMsg { display: flex; }

#recognizedMark {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(20,20,20,0.55);
  z-index: 998;
  justify-content: center;
  align-items: center;
}
.checkCircleWrap {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: #8B0058;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 0 0 rgba(139,0,88,0.6);
  animation: pulseIn 0.35s ease-out;
}
.checkCircleWrap svg {
  width: 52px;
  height: 52px;
}
.checkCircleWrap circle {
  stroke: #fdf8f0;
  stroke-width: 3;
  stroke-dasharray: 151;
  stroke-dashoffset: 151;
  animation: drawCircle 0.4s ease-out forwards;
}
.checkCircleWrap path {
  stroke: #fdf8f0;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  stroke-dasharray: 40;
  stroke-dashoffset: 40;
  animation: drawCheck 0.3s ease-out 0.35s forwards;
}
@keyframes drawCircle {
  to { stroke-dashoffset: 0; }
}
@keyframes drawCheck {
  to { stroke-dashoffset: 0; }
}
@keyframes pulseIn {
  from { transform: scale(0.6); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
</style>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>

<div id="loadingMsg">جاري التحميل...</div>
<div id="arContainer"></div>

<div id="recognizedMark">
  <div class="checkCircleWrap">
    <svg viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="24" fill="none"/>
      <path d="M14 27l7 7 16-16"/>
    </svg>
  </div>
</div>

<div id="videoOverlay">
<video id="myVideo" playsinline webkit-playsinline controls></video>
<button id="playBtn">▶</button>
</div>
<div id="errorMsg"></div>

<script src="index.js"></script>
</body>
</html>
